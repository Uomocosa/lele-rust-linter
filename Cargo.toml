[workspace]
resolver = "2"
members = [
  "crates/atomic-delegate-macros",
  "crates/lele-snake-case",
  "crates/lele-lint",
  "crates/lele-bevy-lint",
]

[workspace.package]
version = "0.0.2"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
atomic-delegate-macros = { path = "crates/atomic-delegate-macros" }
lele-snake-case = { path = "crates/lele-snake-case" }
lele-lint = { path = "crates/lele-lint" }

clap = { version = "=4.6.6", features = ["derive"] }
derive_more = { version = "=1.0.0", features = ["deref", "deref_mut", "display"] }
proc-macro2 = { version = "=1.0.107", features = ["span-locations"] }
quote = "=1.0.47"
rustc_lexer = "=0.1.0"
serde = { version = "=1.0.229", features = ["derive"] }
syn = { version = "=2.0.119", features = ["full", "extra-traits", "visit"] }
tempfile = "=3.27.0"
thiserror = "=2.0.19"
toml = "=0.8.23"
walkdir = "=2.5.0"

# Early-phase profile: optimise for compile time and peak RAM, not runtime speed.
# Debug info is a big RAM/disk cost; keep only line tables for our crates
# (readable backtraces) and none for dependencies.
[profile.dev]
opt-level = 0
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 1
debug = false
